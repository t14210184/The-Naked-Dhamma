name: Verify merit story readability
on:
  pull_request:
    paths:
      - "merit.html"
      - "scripts/verify-merit.mjs"
      - ".github/workflows/merit-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check stories, links, interactions and mobile layouts in Chrome
        env:
          QA_PRINT_PREVIEW: '1'
        run: node scripts/verify-merit.mjs
      - name: Upload responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merit-responsive-screenshots
          path: qa-screenshots/
          if-no-files-found: ignore
