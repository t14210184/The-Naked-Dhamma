name: Verify interactive story readability
on:
  pull_request:
    paths:
      - "merit.html"
      - "history.html"
      - "history-research.html"
      - "index.html"
      - "assets/history/**"
      - "docs/HISTORY_COVERAGE.tsv"
      - "docs/HISTORY_IMAGES_RIGHTS.tsv"
      - "scripts/build-history.mjs"
      - "scripts/data/**"
      - "scripts/render-social.py"
      - "scripts/verify-history.mjs"
      - "scripts/verify-merit.mjs"
      - ".github/workflows/merit-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Traditional Chinese font coverage for real screenshots
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - name: Check stories, links, interactions and mobile layouts in Chrome
        env:
          QA_PRINT_PREVIEW: '1'
        run: node scripts/verify-merit.mjs
      - name: Upload responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merit-responsive-screenshots
          path: qa-screenshots/
          if-no-files-found: ignore

  history-browser:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chinese fonts and preview generator dependency
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk python3-pil
      - name: Install pinned test-only tools
        run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.57.0 @axe-core/playwright@4.10.2
      - name: Install test browser
        run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Verify all three share preview images
        run: /usr/bin/python3 scripts/render-social.py qa-screenshots/social
      - name: Verify history in native test browser and axe
        env:
          ENGINE: ${{ matrix.engine }}
        run: node scripts/verify-history.mjs
      - name: Upload screenshots and trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: history-${{ matrix.engine }}-evidence
          path: qa-screenshots/
          if-no-files-found: warn
